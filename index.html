<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos legales · CineLog Pro</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f7f7f9;
    --text: #1c1c22;
    --muted: #5c5c68;
    --accent: #6c5ce7;
    --border: #e4e4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a;
      --card: #1e1e28;
      --text: #ececf2;
      --muted: #9a9aab;
      --accent: #a29bfe;
      --border: #2b2b38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 28px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0; }
  a { color: var(--accent); }
  .doc {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 16px 0;
    text-decoration: none;
    color: var(--text);
  }
  .doc p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; }
  code { background: var(--card); padding: 2px 6px; border-radius: 5px; font-size: 0.85em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CineLog Pro · Documentos legales</h1>
    <p class="meta"><code>com.ivantorres.cinelogpro</code></p>
  </header>

  <a class="doc" href="privacy-policy.html">
    <h2>Política de Privacidad</h2>
    <p>Qué datos almacena la app y por qué no salen de tu dispositivo. · Privacy Policy</p>
  </a>

  <a class="doc" href="terms.html">
    <h2>Términos y Condiciones</h2>
    <p>Condiciones de uso y créditos de las fuentes de datos. · Terms and Conditions</p>
  </a>

  <footer>
    CineLog Pro — Iván Torres
  </footer>
</div>
</body>
</html>
